name: Replace release archives with native packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-2025
          - platform: macos-arm64
            build_platform: darwin-arm64
            runner: macos-15
          - platform: macos-amd64
            build_platform: darwin-amd64
            runner: macos-15-intel
          - platform: linux-amd64
            build_platform: linux-amd64
            runner: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      EASYPACKAGE_DIST: dist/${{ inputs.release_tag }}
    steps:
      - name: Check out packaging scripts
        uses: actions/checkout@v4

      - name: Check out tagged application source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          path: source

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install GTK development files
        if: matrix.platform == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev

      - name: Build Windows amd64
        if: matrix.platform == 'windows-amd64'
        shell: pwsh
        run: ./source/scripts/build.ps1 -OutputRoot $env:EASYPACKAGE_DIST

      - name: Build native macOS or Linux app
        if: matrix.platform != 'windows-amd64'
        shell: bash
        run: sh source/scripts/build.sh --native

      - name: Prepare Windows executable
        if: matrix.platform == 'windows-amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/packages | Out-Null
          Copy-Item -LiteralPath "source/$env:EASYPACKAGE_DIST/windows-amd64/EasyPackage.exe" -Destination "dist/packages/EasyPackage-$env:RELEASE_TAG-windows-amd64.exe"

      - name: Create macOS disk image
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          BUILD_PLATFORM: ${{ matrix.build_platform }}
        run: |
          set -euo pipefail
          sh scripts/package-macos.sh "source/$EASYPACKAGE_DIST/$BUILD_PLATFORM/EasyPackage" "$RELEASE_TAG" "$RELEASE_PLATFORM" dist/packages

      - name: Create Linux AppImage
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: sh scripts/package-linux-appimage.sh "source/$EASYPACKAGE_DIST/linux-amd64/EasyPackage" "$RELEASE_TAG" dist/packages

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 1

  replace:
    name: Update existing GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist/packages
          merge-multiple: true

      - name: Upload native packages
        run: gh release upload "$RELEASE_TAG" dist/packages/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove old zip and tarball assets
        shell: bash
        run: |
          set -euo pipefail
          for old_asset in \
            "EasyPackage-$RELEASE_TAG-windows-amd64.zip" \
            "EasyPackage-$RELEASE_TAG-macos-arm64.tar.gz" \
            "EasyPackage-$RELEASE_TAG-macos-amd64.tar.gz" \
            "EasyPackage-$RELEASE_TAG-linux-amd64.tar.gz"; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$old_asset"; then
              gh release delete-asset "$RELEASE_TAG" "$old_asset" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
