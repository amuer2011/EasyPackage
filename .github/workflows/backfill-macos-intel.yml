name: Add macOS Intel package to an existing release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Build and upload macOS amd64
    runs-on: macos-15-intel
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      EASYPACKAGE_DIST: dist/${{ inputs.release_tag }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Verify Intel runner and build
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOOS)/$(go env GOARCH)" = darwin/amd64
          sh scripts/build.sh --native

      - name: Package and upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/EasyPackage" dist/packages
          cp "$EASYPACKAGE_DIST/darwin-amd64/EasyPackage" "$RUNNER_TEMP/EasyPackage/EasyPackage"
          cp README.md "$RUNNER_TEMP/EasyPackage/README.md"
          archive="dist/packages/EasyPackage-$RELEASE_TAG-macos-amd64.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" EasyPackage
          gh release upload "$RELEASE_TAG" "$archive" --repo "$GITHUB_REPOSITORY" --clobber
