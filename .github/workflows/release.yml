name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-2025
          - platform: macos-arm64
            build_platform: darwin-arm64
            runner: macos-15
          - platform: macos-amd64
            build_platform: darwin-amd64
            runner: macos-15-intel
          - platform: linux-amd64
            build_platform: linux-amd64
            runner: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      EASYPACKAGE_DIST: dist/${{ github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install GTK development files
        if: matrix.platform == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev

      - name: Build Windows amd64
        if: matrix.platform == 'windows-amd64'
        shell: pwsh
        run: ./scripts/build.ps1 -OutputRoot $env:EASYPACKAGE_DIST

      - name: Build native macOS or Linux app
        if: matrix.platform != 'windows-amd64'
        shell: bash
        run: sh scripts/build.sh --native

      - name: Prepare Windows executable
        if: matrix.platform == 'windows-amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = 'dist/packages'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -LiteralPath "$env:EASYPACKAGE_DIST/windows-amd64/EasyPackage.exe" -Destination "$packageDir/EasyPackage-$env:RELEASE_TAG-windows-amd64.exe"

      - name: Create macOS disk image
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          BUILD_PLATFORM: ${{ matrix.build_platform }}
        run: |
          set -euo pipefail
          sh scripts/package-macos.sh "$EASYPACKAGE_DIST/$BUILD_PLATFORM/EasyPackage" "$RELEASE_TAG" "$RELEASE_PLATFORM" dist/packages

      - name: Create Linux AppImage
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: sh scripts/package-linux-appimage.sh "$EASYPACKAGE_DIST/linux-amd64/EasyPackage" "$RELEASE_TAG" dist/packages

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: dist/packages
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/packages/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
