name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-2025
          - platform: macos-arm64
            runner: macos-15-arm64
          - platform: linux-amd64
            runner: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      EASYPACKAGE_DIST: dist/${{ github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install GTK development files
        if: matrix.platform == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev

      - name: Build Windows amd64
        if: matrix.platform == 'windows-amd64'
        shell: pwsh
        run: ./scripts/build.ps1 -OutputRoot $env:EASYPACKAGE_DIST

      - name: Build native macOS or Linux app
        if: matrix.platform != 'windows-amd64'
        shell: bash
        run: sh scripts/build.sh --native

      - name: Package Windows zip
        if: matrix.platform == 'windows-amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'EasyPackage'
          $packageDir = 'dist/packages'
          New-Item -ItemType Directory -Force -Path $stage, $packageDir | Out-Null
          Copy-Item -LiteralPath "$env:EASYPACKAGE_DIST/windows-amd64/EasyPackage.exe" -Destination $stage
          Copy-Item -LiteralPath 'README.md' -Destination $stage
          $archive = "EasyPackage-$env:RELEASE_TAG-windows-amd64.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $packageDir $archive) -CompressionLevel Optimal

      - name: Package macOS or Linux tarball
        if: matrix.platform != 'windows-amd64'
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p dist/packages "$RUNNER_TEMP/EasyPackage"
          cp "$EASYPACKAGE_DIST/$RELEASE_PLATFORM/EasyPackage" "$RUNNER_TEMP/EasyPackage/EasyPackage"
          cp README.md "$RUNNER_TEMP/EasyPackage/README.md"
          tar -C "$RUNNER_TEMP" -czf "dist/packages/EasyPackage-$RELEASE_TAG-$RELEASE_PLATFORM.tar.gz" EasyPackage

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: dist/packages
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/packages/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
